name: veoplay_app
description: VeoPlay - video and music player
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  wakelock_plus: ^1.2.8
  simple_pip_mode: ^1.1.0
  share_plus: ^10.1.4
  cupertino_icons: ^1.0.8
  photo_manager: ^3.12.0
  shared_preferences: ^2.5.6
  volume_controller: ^2.0.8
  screen_brightness: ^1.0.1
  audio_session: ^0.1.25
  video_thumbnail: ^0.5.6
  on_audio_query: 2.9.0
  just_audio: ^0.9.46
  just_audio_background: ^0.0.1-beta.17
  receive_intent: ^0.2.8
  file_picker: ^8.3.7
  package_info_plus: ^9.0.1
  media_kit: ^1.1.11
  sqflite: ^2.4.0
  media_kit_video: ^2.0.1
  media_kit_libs_android_video: ^1.3.8
  permission_handler: ^11.3.1

dependency_overrides:
  shared_preferences_android: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/logo.png"
  adaptive_icon_background: "#00000000"
  adaptive_icon_foreground: "assets/logo.png"
