name: veoplay_app
description: My first Flutter video player built on smartphone
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.8.1
  cupertino_icons: ^1.0.6
  permission_handler: ^11.3.1
  photo_manager: ^3.1.4
  shared_preferences: ^2.2.2
  volume_controller: ^2.0.7
  screen_brightness: ^1.0.1
  video_thumbnail: ^0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  adaptive_icon_background: "#00000000"
  adaptive_icon_foreground: "assets/logo.png"
  min_sdk_android: 21
