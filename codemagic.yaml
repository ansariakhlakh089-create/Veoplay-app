workflows:
  android-apk:
    name: VeoPlay APK
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Generate Gradle wrapper
        script: |
          gradle wrapper --gradle-version 8.14.3
      - name: Build debug APK
        script: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk
