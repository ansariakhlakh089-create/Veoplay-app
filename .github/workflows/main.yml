name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - run: flutter clean

      - name: Flutter version dikhao
        run: flutter --version

      - run: flutter pub get --enforce-lockfile

      - uses: actions/upload-artifact@v4
        with:
          name: pubspec-lock
          path: pubspec.lock
          retention-days: 30

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Gradle memory badhao
        run: |
          printf '\norg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g\n' >> android/gradle.properties

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: veoplay-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3
