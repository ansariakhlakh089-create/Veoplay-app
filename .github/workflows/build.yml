name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter clean
        run: flutter clean

      - name: Flutter version dikhao
        run: flutter --version

      # --enforce-lockfile hata diya, kyunki pubspec.yaml badal gaya hai
      - name: Packages download karo
        run: flutter pub get

      # naya pubspec.lock yahan se download kar sakte ho (Artifacts me)
      - name: pubspec.lock save karo
        uses: actions/upload-artifact@v4
        with:
          name: pubspec-lock
          path: pubspec.lock

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Gradle memory badhao
        run: |
          mkdir -p android
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties

      - name: Run flutter build apk --release
        run: flutter build apk --release

      - name: APK upload karo
        uses: actions/upload-artifact@v4
        with:
          name: VeoPlay-APK
          path: build/app/outputs/flutter-apk/app-release.apk
