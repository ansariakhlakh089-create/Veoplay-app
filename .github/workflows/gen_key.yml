name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v -keystore my-upload-key.jks -storetype PKCS12 -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass VeoPlay123 -keypass VeoPlay123 -dname "CN=Akhlakh Ansari, OU=VeoPlay, O=VeoPlay, C=IN"
      
      - name: Get Base64
        run: |
          echo "================ COPY FROM HERE ================"
          base64 -w0 my-upload-key.jks
          echo ""
          echo "================ COPY TILL HERE ================"
