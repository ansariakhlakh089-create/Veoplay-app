name: Release AAB (Play Store)

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secrets पूरे हैं या नहीं
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KKP: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KP" ] || [ -z "$KA" ] || [ -z "$KKP" ]; then
            echo "GitHub Secrets पूरे नहीं हैं. ये 4 चाहिए: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version dikhao
        run: flutter --version

      - name: Packages download karo
        run: flutter pub get

      - name: Keystore तैयार करो
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # JKS file banao
          echo "$KEYSTORE_BASE64" | base64 -d -i > android/app/upload-keystore.jks
          
      - name: Create key.properties
        run: |
          # key.properties file banao
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Gradle memory badhao
        run: |
          mkdir -p android
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties
          # Daemon band karo taaki naye variables (secrets) properly padhe jayein
          echo "org.gradle.daemon=false" >> android/gradle.properties

      - name: Build signed AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Signing जाँचो
        run: keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | head -12

      - name: AAB upload karo
        uses: actions/upload-artifact@v4
        with:
          name: VeoPlay-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 3

      - name: Mapping file (crash पढ़ने के लिए)
        uses: actions/upload-artifact@v4
        with:
          name: mapping
          path: build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 30
